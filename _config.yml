title: display-share
description: Windows 화면 캡처 · 비전 파이프라인 문서
url: "https://NAMUORI00.github.io"
baseurl: "/display-share"
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
relative_links:
  enabled: true
  collections: true
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
lang: ko
exclude:
  - README.md
  - .agents
  - .codex
  - Gemfile
  - Gemfile.lock
defaults:
  - scope:
      path: ""
    values:
      layout: default
