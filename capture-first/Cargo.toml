[workspace]
members = [
    "apps/smartscreencapture",
    "crates/capture-core",
    "crates/capture-windows",
    "crates/config",
    "crates/graphics-d3d11",
    "crates/inference-dml",
    "crates/pipeline",
    "crates/telemetry",
    "crates/ui",
    "crates/vision-gpu",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
crossbeam-channel = "0.5.15"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.33.3"
egui_dock = "0.18.0"
# eframe's wgpu dep disables defaults; enable Windows backends via feature unification.
wgpu = { version = "27.0.1", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
imageproc = "0.26.1"
ndarray = "0.16.1"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "directml", "openvino", "tls-native"] }
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
windows = "0.62.2"
windows-capture = "2.0.0-alpha.7"
